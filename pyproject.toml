[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-factor-timing"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "cvxpy>=1.5",
  "scikit-learn>=1.5",
  "yfinance>=0.2.40",
  "fredapi>=0.5",
  "hmmlearn>=0.3",
  "pyarrow>=16",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]